apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pms-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gitsmyun/pms.git
    targetRevision: develop
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: pms-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
