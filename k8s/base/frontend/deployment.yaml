apiVersion: apps/v1
kind: Deployment
metadata:
  name: pms-frontend
  labels:
    app: pms-frontend
spec:
  replicas: 1
  strategy:
    type: Recreate  # RollingUpdate 대신 Recreate 사용
  selector:
    matchLabels:
      app: pms-frontend
  template:
    metadata:
      labels:
        app: pms-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/gitsmyun/pms-frontend:develop-latest
        imagePullPolicy: Always  # ✅ 항상 최신 이미지 Pull
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 3
