apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate  # RollingUpdate 대신 Recreate 사용
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:23.0
        imagePullPolicy: Always  # ✅ 항상 최신 이미지 Pull
        args:
        - start-dev
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: KEYCLOAK_ADMIN
          value: admin
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: admin-password
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HOSTNAME_STRICT_HTTPS
          value: "false"
        - name: KC_PROXY
          value: "edge"
        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: KC_METRICS_ENABLED
          value: "true"
        - name: JAVA_OPTS_APPEND
          value: "-Djgroups.dns.query=keycloak"
        resources:
          requests:
            memory: "1Gi"      # 512Mi → 1Gi
            cpu: "500m"        # 250m → 500m
          limits:
            memory: "2Gi"      # 1Gi → 2Gi
            cpu: "1000m"       # 500m → 1000m (1 core)
        startupProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 60   # 30 → 60초
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 40      # 30 → 40 (최대 7분)
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 0  # startupProbe 통과 후 즉시 시작
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 0  # startupProbe 통과 후 즉시 시작
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
