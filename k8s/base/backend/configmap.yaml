apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "pms"
  DB_USER: "pms"
  # Keycloak Issuer URI (Kubernetes 내부 통신)
  # 주의: Keycloak이 KC_HTTP_RELATIVE_PATH=/keycloak로 실행됨
  OIDC_ISSUER_URI: "http://keycloak:8080/keycloak/realms/pms"
