name: ci build and publish

# 작성일 2026 01 12
# 작업자 윤성민 책임
# 설명 이 워크플로우는 PMS2의 CI 파이프라인으로 develop 브랜치 머지 시 백엔드와 프론트엔드를 빌드 테스트하고 도커 이미지를 GHCR에 푸시한다
# 설명 dev 자동 배포 편의성을 위해 커밋 sha 태그와 함께 develop latest 고정 태그를 함께 발행한다
# 설명 test prod 승격은 별도 승격 절차로 수행하며 본 워크플로우는 dev 배포를 위한 이미지 발행까지만 책임진다

"on":
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch: {}

permissions:
  contents: write  # Git 커밋 권한 (Kustomization 자동 업데이트)
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend build test and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/pms-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 (Git push를 위해 필요)
          token: ${{ secrets.GITHUB_TOKEN }}  # Git push 권한

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Gradle test
        shell: bash
        run: ./gradlew test --no-daemon

      - name: Derive tags
        id: tags
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "develop_tag=develop-latest" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend/pms-backend
          file: backend/pms-backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pms-backend:${{ steps.tags.outputs.sha_tag }}
            ghcr.io/${{ github.repository_owner }}/pms-backend:${{ steps.tags.outputs.develop_tag }}

      # 🆕 Kustomization 자동 업데이트
      - name: Update Kustomization with backend image tag
        shell: bash
        run: |
          cd k8s/overlays/dev
          
          # 현재 SHA 추출
          SHORT_SHA="${GITHUB_SHA::7}"
          
          # backend 이미지 태그 업데이트
          sed -i.bak "/name: ghcr.io\/gitsmyun\/pms-backend/,/newTag:/ s|newTag: .*|newTag: sha-${SHORT_SHA}|" kustomization.yaml
          rm -f kustomization.yaml.bak
          
          # 변경사항 확인
          git diff kustomization.yaml
          
          # Git 설정
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 변경사항이 있을 경우에만 커밋
          if git diff --quiet kustomization.yaml; then
            echo "No changes to kustomization.yaml"
          else
            git add kustomization.yaml
            git commit -m "chore(k8s): Update backend image to sha-${SHORT_SHA} [skip ci]"
            git push
          fi

  frontend:
    name: frontend build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 (Git push를 위해 필요)
          token: ${{ secrets.GITHUB_TOKEN }}  # Git push 권한

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        working-directory: frontend
        run: pnpm build

      - name: Derive tags
        id: tags
        shell: bash
        run: |
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "develop_tag=develop-latest" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pms-frontend:${{ steps.tags.outputs.sha_tag }}
            ghcr.io/${{ github.repository_owner }}/pms-frontend:${{ steps.tags.outputs.develop_tag }}

      # 🆕 Kustomization 자동 업데이트
      - name: Update Kustomization with frontend image tag
        shell: bash
        run: |
          cd k8s/overlays/dev
          
          # 현재 SHA 추출
          SHORT_SHA="${GITHUB_SHA::7}"
          
          # frontend 이미지 태그 업데이트
          sed -i.bak "/name: ghcr.io\/gitsmyun\/pms-frontend/,/newTag:/ s|newTag: .*|newTag: sha-${SHORT_SHA}|" kustomization.yaml
          rm -f kustomization.yaml.bak
          
          # 변경사항 확인
          git diff kustomization.yaml
          
          # Git 설정
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 변경사항이 있을 경우에만 커밋
          if git diff --quiet kustomization.yaml; then
            echo "No changes to kustomization.yaml"
          else
            git add kustomization.yaml
            git commit -m "chore(k8s): Update frontend image to sha-${SHORT_SHA} [skip ci]"
            git push
          fi

